name: Compilar FarmaciaDB Android APK Nativo

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-native-apk:
    name: Compilar Proyecto Nativo Kotlin (android-native-app)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK Nativo Kotlin + Jetpack Compose
        working-directory: android-native-app
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../FarmaciaDB-Nativo.apk

      - name: Subir FarmaciaDB-Nativo.apk listo para instalar
        uses: actions/upload-artifact@v4
        with:
          name: FarmaciaDB-Nativo-APK
          path: FarmaciaDB-Nativo.apk
          retention-days: 30
